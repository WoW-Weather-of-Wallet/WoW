stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "front"'
    - if: '$CI_COMMIT_BRANCH == "back"'
    - if: '$CI_COMMIT_BRANCH == "ai"'
    - if: '$CI_COMMIT_BRANCH == "infra"'
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
    - docker run --rm -v $CI_PROJECT_DIR/Frontend:/app -w /app/react node:20-alpine sh -c "npm ci && npm run build"
    - docker run --rm -v $CI_PROJECT_DIR/Frontend:/app -w /app/native node:20-alpine sh -c "npm ci && npx tsc -p tsconfig.json --noEmit"
    - docker run --rm -v $CI_PROJECT_DIR/Frontend:/app -w /app/shared node:20-alpine sh -c "npm ci && npx tsc -p tsconfig.json --noEmit"
    - docker build -t $DOCKERHUB_USERNAME/wow-backend:latest $CI_PROJECT_DIR/Backend
    - docker push $DOCKERHUB_USERNAME/wow-backend:latest

deploy:
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - mkdir -p /home/gitlab-runner/deploy
    - cd /home/gitlab-runner/deploy
    - cp $CI_PROJECT_DIR/Infra/Docker/docker-compose.prod.yml ./docker-compose.prod.yml
    - mkdir -p ./nginx
    - cp $CI_PROJECT_DIR/Infra/Nginx/nginx.conf ./nginx/nginx.conf
    - |
      cat > .env.prod << ENV
      DB_URL=${DB_URL}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}
      REDIS_HOST=${REDIS_HOST}
      REDIS_PORT=${REDIS_PORT}
      SPRING_PROFILES_ACTIVE=prod
      JWT_SECRET=${JWT_SECRET}
      SSO_SSAFY_CLIENT_ID=${SSO_SSAFY_CLIENT_ID}
      SSO_SSAFY_CLIENT_SECRET=${SSO_SSAFY_CLIENT_SECRET}
      SSO_SSAFY_REDIRECT_URI=${SSO_SSAFY_REDIRECT_URI}
      SOLAPI_API_KEY=${SOLAPI_API_KEY}
      SOLAPI_API_SECRET=${SOLAPI_API_SECRET}
      SOLAPI_SENDER=${SOLAPI_SENDER}
      ENV
    - docker-compose -f docker-compose.prod.yml down
    - docker-compose -f docker-compose.prod.yml up -d
