services:
  backend:
    image: $DOCKERHUB_USERNAME/wow-backend:latest
    container_name: wow-backend
    restart: unless-stopped
    env_file:
      - ./.env.prod
    volumes:
      - ${FIREBASE_SA_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8050"

  nginx:
    image: nginx:latest
    container_name: wow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
