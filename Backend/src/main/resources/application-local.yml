spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wow_local_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: d2f8e1a3c7b94f6d2e0a5c8b1f3e7d9a4c2b6f8e0d3a5c7b9f1e4d6a8c0b2f4