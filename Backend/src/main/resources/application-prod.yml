spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8050}

# [added] 이유: JWT secret이 프로덕션 설정에 누락되어 환경변수 없으면 앱 기동 실패
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:wow}

# [added] 이유: SSO 설정이 프로덕션에 누락
sso:
  ssafy:
    client-id: ${SSO_SSAFY_CLIENT_ID}
    client-secret: ${SSO_SSAFY_CLIENT_SECRET}
    redirect-uri: ${SSO_SSAFY_REDIRECT_URI}

# [added] 이유: SMS 발송 설정이 프로덕션에 누락
solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}

firebase:
  enabled: true
  service-account-key: file:/run/secrets/firebase-service-account.json

# [added] 이유: S3 설정이 프로덕션에 누락되어 TermService 등에서 기동 실패
cloud:
  aws:
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}

# [added] 이유: 프로덕션에서 Swagger UI 비공개 처리
app:
  ssafy-app-base-uri: ${APP_SSAFY_APP_BASE_URI:wow://auth/ssafy}
  swagger-public: false

flask:
  url: ${FLASK_URL}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
