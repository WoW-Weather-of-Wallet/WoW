spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8050}

jwt:
  secret: ${JWT_SECRET}

sso:
  ssafy:
    client-id: ${SSO_SSAFY_CLIENT_ID}
    client-secret: ${SSO_SSAFY_CLIENT_SECRET}
    redirect-uri: ${SSO_SSAFY_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}