spring:
  application:
    name: backend

  profiles:
    default: local

#  datasource:
#    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
#    username: ${POSTGRES_USER}
#    password: ${POSTGRES_PASSWORD}

jwt:
  access-exp-min: 30
  refresh-exp-day: 14
  issuer: wowDev

sso:
  ssafy:
    client-id: ${SSO_SSAFY_CLIENT_ID}
    client-secret: ${SSO_SSAFY_CLIENT_SECRET}
    redirect-uri: ${SSO_SSAFY_REDIRECT_URI}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender: ${SOLAPI_SENDER}

flask:
  url: http://127.0.0.1:5000
